name: Build GenieX APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        working-directory: geniex_chat_android
        run: |
          chmod +x build.sh || true
          ./build.sh || gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GenieX-Demo-APK
          path: geniex_chat_android/**/build/outputs/apk/**/*.apk
